name: macOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        xcode: ["16.4", "26.3"]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core and app-state tests
        run: swift test
      - name: Universal native app build
        run: >-
          xcodebuild -project DownloadScroller.xcodeproj -scheme DownloadScroller
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO build
      - name: Validate manifests
        run: |
          plutil -lint Config/Info.plist Config/DownloadScroller.entitlements Sources/DownloadScroller/Resources/PrivacyInfo.xcprivacy
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/DerivedData/Build/Products/Release/DownloadScroller.app/Contents/Info.plist
